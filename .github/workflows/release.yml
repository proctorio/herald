name: release

# Canonical source of this workflow is the internal Open repo; the sync
# mirrors it here. Publishes a GitHub release for every release/* tag with
# the store artifact attached, after rebuilding it from the tagged tree and
# rerunning the verification gates. The version comes from the manifest and
# the tag must match it exactly.

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the tag matches the manifest version
        run: |
          ver="$(node -p "require('./src/manifest.json').version")"
          tag="${GITHUB_REF_NAME#release/}"
          if [ "$ver" != "$tag" ]; then
            echo "Tag $tag does not match manifest version $ver"
            exit 1
          fi
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Audit the built extension
        run: |
          bash scripts/audit-remote-code.sh dist
          bash scripts/verify-manifest.sh dist/manifest.json
      - run: npm run package
      # Only the production package is attached: it is fully reproducible
      # from this public tree. The beta channel package is assembled by the
      # internal release pipeline (beta branding is applied there) and only
      # ever exists between that pipeline and the Chrome Web Store.
      - name: Audit the unpacked store artifact
        run: |
          ver="${GITHUB_REF_NAME#release/}"
          unzip -q "build/herald-${ver}.zip" -d build/unpacked
          bash scripts/audit-remote-code.sh build/unpacked
          bash scripts/verify-manifest.sh build/unpacked/manifest.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#release/}"
          gh release create "$GITHUB_REF_NAME" "build/herald-${ver}.zip" --title "v${ver}" --generate-notes || echo "release already exists"
