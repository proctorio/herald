name: release

# Canonical source of this workflow is the internal Open repo; the sync
# mirrors it here. Publishes a GitHub release for every release/* tag with
# the store artifact attached, after rebuilding it from the tagged tree and
# rerunning the verification gates. The version comes from the manifest and
# the tag must match it exactly.

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the tag matches the manifest version
        run: |
          ver="$(node -p "require('./src/manifest.json').version")"
          tag="${GITHUB_REF_NAME#release/}"
          if [ "$ver" != "$tag" ]; then
            echo "Tag $tag does not match manifest version $ver"
            exit 1
          fi
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Audit the built extension
        run: |
          bash scripts/audit-remote-code.sh dist
          bash scripts/verify-manifest.sh dist/manifest.json
      - run: npm run package
      - name: Audit the unpacked store artifacts
        run: |
          ver="${GITHUB_REF_NAME#release/}"
          unzip -q "build/lectern-${ver}.zip" -d build/unpacked-prod
          unzip -q "build/lectern-beta-${ver}.zip" -d build/unpacked-beta
          for dir in build/unpacked-prod build/unpacked-beta; do
            bash scripts/audit-remote-code.sh "$dir"
            bash scripts/verify-manifest.sh "$dir/manifest.json"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#release/}"
          gh release create "$GITHUB_REF_NAME" "build/lectern-${ver}.zip" "build/lectern-beta-${ver}.zip" --title "v${ver}" --generate-notes || echo "release already exists"
