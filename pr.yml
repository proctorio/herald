# Also run on every merge to main, not only on PRs (the build policy).
# Advanced Security keeps alerts per branch: only a run on main publishes
# main's CodeQL and dependency results, so without this a merged fix leaves
# its alert active on main until someone queues a run by hand. batch folds
# merges that land during a run into the next one.
trigger:
  batch: true
  branches:
    include:
    - main

resources:
  repositories:
    - repository: templates
      type: git
      name: Plumbing/core-templates
    - repository: plumbing
      type: git
      name: plumbing

stages:
- template: PR/js/default.yml@templates  # Template reference
  parameters:
    testing: true
    command: "build"
    # vitest 4 / jsdom 30 need Node 22+; the agents' system Node is older
    # (fails in the vitest forks pool). Parameter requires the
    # core-templates nodeVersion change to be merged first.
    nodeVersion: "24.x"
    # Lint with this repo's own eslint.config.js instead of the template's
    # org config over src/ (which lints the vendored code and ignores this
    # repo's scoped relaxations). The check script, never `npm run lint`:
    # that one runs eslint --fix, and CI must fail on a lint error, not fix
    # the code in place and pass. Parameter requires the core-templates
    # lintCommand change to be merged first.
    lintCommand: "npm run lint:check"
