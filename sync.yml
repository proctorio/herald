trigger:
  branches:
    include:
    - main

# Never build pull requests. Azure Pipelines builds every PR of a
# GitHub-bound pipeline by default, and a PR run checks out the PR's
# temporary test merge; the import must only ever take GitHub main. The
# shared sync template also refuses anything but main's tip.
pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: Plumbing/core-templates
    - repository: herald
      type: git
      name: Open/herald

stages:
- template: stages/sync/sync.yml@templates  # Template reference
  parameters:
    checkout: herald
    # GitHub-side merges (community patches, dependency bumps) are release
    # candidates: the import commit carries no [skip ci], so version-pack
    # runs on it and the release queues at the normal approval gate.
    skip_ci: false
