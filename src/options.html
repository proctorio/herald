<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herald Options</title>
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">

  <script type="module" src="js/options.js"></script>
</head>
<body>
  <main class="container-fluid">
    <!-- The heading stays for document structure and assistive tech; the
         visible page chrome is just the cards. -->
    <h1 class="visually-hidden" data-i18n="options_heading"></h1>

    <section class="card">
    <div class="layout">
      <div>
        <label for="voices" data-i18n="options_voice_label"></label>
        <button id="languages-edit-button" type="button" class="btn btn-sm btn-outlined" data-i18n-label="options_languages_edit_label">
          <i class="material-icons" aria-hidden="true">filter_alt</i>
        </button>
      </div>
      <div>
        <select id="voices" class="form-control">
        </select>
      </div>

      <div>
        <label id="rate-label" for="rate-input" data-i18n="options_rate_label"></label>
        <button id="rate-edit-button" type="button" class="btn btn-sm btn-outlined" data-i18n-label="options_rate_edit_label">
          <i class="material-icons" aria-hidden="true">mode_edit</i>
        </button>
      </div>
      <div>
        <div id="rate" class="slider" data-label="rate-label" data-min="-1" data-max="1" data-steps="40" data-pow="3"></div>
        <div id="rate-input-div">
          <input id="rate-input" class="form-control" type="text" maxlength="5" />
        </div>
        <small id="rate-warning" class="form-text warning" data-i18n="options_rate_warning"></small>
      </div>

      <div class="pitch-visible">
        <span id="pitch-label" data-i18n="options_pitch_label"></span>
      </div>
      <div class="pitch-visible">
        <div id="pitch" class="slider" data-label="pitch-label" data-min="0" data-max="2" data-steps="40"></div>
      </div>

      <div>
        <span id="volume-label" data-i18n="options_volume_label"></span>
      </div>
      <div>
        <div id="volume" class="slider" data-label="volume-label" data-min="0.2" data-max="1" data-steps="40"></div>
      </div>

      <div>
        <label for="show-highlighting" data-i18n="options_show_highlighting"></label>
      </div>
      <select id="show-highlighting" class="form-control">
        <option value="0" data-i18n="options_highlighting_off"></option>
        <option value="1" data-i18n="options_highlighting_popup"></option>
        <option value="2" data-i18n="options_highlighting_window"></option>
      </select>

    </div>

    <hr class="card-separator">
    <div class="card-links">
      <!-- A span, not an anchor, because the target is a chrome:// URL that
           only tabs.create may open; role and tabindex make it a real link
           for keyboard and screen reader users. -->
      <span id="hotkeys-link" role="link" tabindex="0" data-i18n="options_hotkeys_link"></span>
      <a href="advanced-options.html" id="expand-button" class="material-icons" data-i18n-label="options_expand_label">open_in_new</a>
    </div>
    </section>

    <section class="card" id="exam-mode">
      <h2 class="section-heading" data-i18n="options_exam_heading"></h2>
      <label>
        <input type="checkbox" id="exam-safe-mode" aria-describedby="exam-safe-description">
        <span data-i18n="options_exam_safe_label"></span>
      </label>
      <small id="exam-safe-description" class="form-text text-muted" data-i18n="options_exam_safe_description"></small>
    </section>

    <section class="card">
    <div class="buttons">
      <button type="button" id="test-voice" class="btn btn-filled">
        <div class="spinner" aria-hidden="true"></div>
        <span data-i18n="options_test_button"></span>
      </button>
      <button type="button" id="reset" class="btn btn-outlined" data-i18n="options_reset_button"></button>
      <span class="green-check" aria-hidden="true">
        <i class="material-icons">check</i>
      </span>
    </div>

    <div class="form-group">
      <small id="status" role="alert"></small>
    </div>
    </section>

    <section class="card" id="about">
      <h2 class="section-heading" data-i18n="options_about_heading"></h2>
      <!-- Attribution is deliberately not localized: the notice ships verbatim
           in every locale to satisfy the MIT license attribution requirement. -->
      <small class="form-text text-muted">
        Herald <span id="about-version"></span>, published by Proctorio Inc.
        <br>
        Built on <a href="https://github.com/ken107/read-aloud" target="_blank" rel="noopener">Read Aloud</a> by Hai Phan, MIT licensed.
        Herald is an independent project and is not affiliated with or endorsed by the original author.
        The complete license text is distributed with this extension in the LICENSE and NOTICE files.
      </small>
    </section>
  </main>
</body>
</html>
