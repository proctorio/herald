<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herald</title>

  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script type="module" src="js/popup.js"></script>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Herald</h1>
    <!-- The single polite live region for playback state changes required by
         docs/herald/05-accessibility-spec.md. Errors go to #status, which is
         role=alert (the one allowed assertive surface). -->
    <div id="playback-status" class="visually-hidden" role="status" aria-live="polite"></div>
    <div id="status" role="alert">
    </div>
    <div id="buttons">
      <button type="button" class="material-icons button-1" id="btnRewind" data-i18n-label="popup_rewind_label">&#xe020;</button>
      <button type="button" class="material-icons button-1" id="btnPlay" data-i18n-label="popup_play_label">&#xe037;</button>
      <button type="button" class="material-icons button-1" id="btnPause" data-i18n-label="popup_pause_label">pause</button>
      <button type="button" class="material-icons button-1" id="btnStop" data-i18n-label="popup_stop_label">stop</button>
      <button type="button" class="material-icons button-1" id="btnSettings" data-i18n-label="popup_settings_label">settings</button>
      <button type="button" class="material-icons button-1" id="btnForward" data-i18n-label="popup_forward_label">&#xe01f;</button>
    </div>
    <div id="highlight">
    </div>
    <div id="toolbar">
      <div class="btn-group">
        <button id="decrease-font-size" type="button" class="btn" data-i18n-label="popup_decrease_font_label">
          <span aria-hidden="true">A-</span>
        </button>
        <button id="increase-font-size" type="button" class="btn" data-i18n-label="popup_increase_font_label">
          <span aria-hidden="true">A+</span>
        </button>
      </div>
      <div class="btn-group">
        <button id="toggle-dark-mode" type="button" class="btn" data-i18n-label="popup_dark_mode_label">
          <i class="material-icons" aria-hidden="true">dark_mode</i>
        </button>
      </div>
      <div class="btn-group window-size">
        <button id="decrease-window-size" type="button" class="btn" data-i18n-label="popup_decrease_window_label">
          <i class="material-icons" aria-hidden="true">remove</i>
        </button>
        <button id="increase-window-size" type="button" class="btn" data-i18n-label="popup_increase_window_label">
          <i class="material-icons" aria-hidden="true">add</i>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
